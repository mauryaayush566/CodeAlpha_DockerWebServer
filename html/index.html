<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CodeAlpha Docker Web Server</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#0f172a; color:#e2e8f0;
           display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
    .card { background:#1e293b; padding:2rem 2.5rem; border-radius:16px; text-align:center;
            box-shadow:0 10px 30px rgba(0,0,0,.4); max-width:420px; }
    h1 { margin-top:0; color:#38bdf8; }
    .badge { display:inline-block; background:#22c55e; color:#052e16; padding:.2rem .7rem;
             border-radius:999px; font-weight:600; font-size:.85rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🐳 Hello from Docker!</h1>
    <p>This page is served by <b>Nginx</b> running inside a Docker container.</p>
    <span class="badge">Container Running</span>
    <p style="opacity:.6;font-size:.85rem">CodeAlpha DevOps Internship </p>
  </div>
</body>
</html>
